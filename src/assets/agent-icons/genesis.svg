<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
  <!-- Genesis: a single spark — central dot with eight radiating rays of varying length, plus two short arcs (idea emerging) -->
  <circle cx="32" cy="32" r="3" fill="currentColor" stroke="none" />
  <!-- 8 rays -->
  <line x1="32" y1="6"  x2="32" y2="14" />
  <line x1="32" y1="50" x2="32" y2="58" />
  <line x1="6"  y1="32" x2="14" y2="32" />
  <line x1="50" y1="32" x2="58" y2="32" />
  <!-- diagonals (alternating long / short) -->
  <line x1="13.4" y1="13.4" x2="19" y2="19" />
  <line x1="45"   y1="45"   x2="50.6" y2="50.6" />
  <line x1="50.6" y1="13.4" x2="45"   y2="19" />
  <line x1="19"   y1="45"   x2="13.4" y2="50.6" />
  <!-- a soft outer halo (dashed) suggesting radiance without solid mass -->
  <circle cx="32" cy="32" r="20" stroke-dasharray="1 5" stroke-width="1.2" opacity="0.65" />
  <!-- two short seed arcs opening upward -->
  <path d="M22 38 Q32 42 42 38" stroke-width="1.5" opacity="0.55" />
</svg>