<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
  <!-- Nexus: a small graph — four nodes connected by edges (the knowledge graph) -->
  <!-- edges (drawn first so nodes sit on top) -->
  <line x1="14" y1="18" x2="32" y2="32" />
  <line x1="50" y1="18" x2="32" y2="32" />
  <line x1="32" y1="32" x2="20" y2="50" />
  <line x1="32" y1="32" x2="44" y2="50" />
  <line x1="14" y1="18" x2="32" y2="12" />
  <line x1="50" y1="18" x2="32" y2="12" />
  <!-- nodes (filled with currentColor at low opacity) -->
  <circle cx="14" cy="18" r="4" fill="currentColor" fill-opacity="0.18" />
  <circle cx="50" cy="18" r="4" fill="currentColor" fill-opacity="0.18" />
  <circle cx="32" cy="12" r="3" fill="currentColor" fill-opacity="0.18" />
  <circle cx="32" cy="32" r="5" fill="currentColor" fill-opacity="0.22" />
  <circle cx="20" cy="50" r="4" fill="currentColor" fill-opacity="0.18" />
  <circle cx="44" cy="50" r="4" fill="currentColor" fill-opacity="0.18" />
</svg>