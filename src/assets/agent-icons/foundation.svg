<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
  <!-- Foundation: three stacked horizontal bars (foundation stones / layers) with subtle separator ticks -->
  <!-- bottom stone (widest) -->
  <rect x="8"  y="44" width="48" height="10" rx="1.5" />
  <line x1="24" y1="44" x2="24" y2="54" opacity="0.55" />
  <line x1="40" y1="44" x2="40" y2="54" opacity="0.55" />
  <!-- middle stone -->
  <rect x="12" y="30" width="40" height="10" rx="1.5" />
  <line x1="26" y1="30" x2="26" y2="40" opacity="0.55" />
  <line x1="38" y1="30" x2="38" y2="40" opacity="0.55" />
  <!-- top stone (narrowest) -->
  <rect x="16" y="16" width="32" height="10" rx="1.5" />
  <line x1="28" y1="16" x2="28" y2="26" opacity="0.55" />
  <line x1="36" y1="16" x2="36" y2="26" opacity="0.55" />
  <!-- ground line -->
  <line x1="4" y1="58" x2="60" y2="58" stroke-width="1.5" opacity="0.45" />
</svg>