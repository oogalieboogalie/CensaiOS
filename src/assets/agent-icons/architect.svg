<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
  <!-- Architect: compass rose — a circle with cardinal-direction ticks and a diagonal needle pointing NE -->
  <circle cx="32" cy="32" r="24" stroke-width="1.5" />
  <circle cx="32" cy="32" r="18" stroke-dasharray="2 4" stroke-width="1.2" />
  <!-- cardinal ticks -->
  <line x1="32" y1="4" x2="32" y2="10" />
  <line x1="32" y1="54" x2="32" y2="60" />
  <line x1="4" y1="32" x2="10" y2="32" />
  <line x1="54" y1="32" x2="60" y2="32" />
  <!-- intercardinal ticks -->
  <line x1="13.4" y1="13.4" x2="17.5" y2="17.5" />
  <line x1="46.5" y1="46.5" x2="50.6" y2="50.6" />
  <line x1="50.6" y1="13.4" x2="46.5" y2="17.5" />
  <line x1="13.4" y1="50.6" x2="17.5" y2="46.5" />
  <!-- needle: NE-SW axis -->
  <polygon points="32,32 49,15 38,32 32,49" fill="currentColor" fill-opacity="0.18" />
  <line x1="32" y1="32" x2="49" y2="15" stroke-width="2.4" />
  <line x1="32" y1="32" x2="15" y2="49" stroke-width="2.4" />
  <!-- center pivot -->
  <circle cx="32" cy="32" r="2" fill="currentColor" stroke="none" />
</svg>