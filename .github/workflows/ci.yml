name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify source, tests, and production build
        run: npm run check

      - name: Validate window SDK
        run: npm run window:validate

      - name: Run malicious-code tripwires
        run: node scripts/security-tripwires.mjs

  release:
    name: Publish self-host release
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - name: Check out the validated commit
        uses: actions/checkout@v4

      - name: Build and publish the immutable container
        id: package
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          short_sha="${GITHUB_SHA::12}"
          release_date="$(date -u +%Y.%m.%d)"
          release_tag="selfhost-${release_date}-${short_sha}"
          image="ghcr.io/$(echo "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')"

          echo "$GH_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          docker build \
            --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --tag "$image:$release_tag" \
            --tag "$image:sha-$short_sha" \
            --tag "$image:latest" \
            .
          docker push "$image:$release_tag"
          docker push "$image:sha-$short_sha"
          docker push "$image:latest"

          {
            echo "source_commit=$GITHUB_SHA"
            echo "release_tag=$release_tag"
            echo "image=$image:$release_tag"
            echo "sha_image=$image:sha-$short_sha"
          } > censai-self-host-release.txt

          echo "release_tag=$release_tag" >> "$GITHUB_OUTPUT"
          echo "image=$image:$release_tag" >> "$GITHUB_OUTPUT"

      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.package.outputs.release_tag }}
          RELEASE_IMAGE: ${{ steps.package.outputs.image }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "$RELEASE_TAG already exists; the immutable release is unchanged."
            exit 0
          fi

          gh release create "$RELEASE_TAG" \
            censai-self-host-release.txt \
            --target "$GITHUB_SHA" \
            --generate-notes \
            --title "Censai self-host ${RELEASE_TAG#selfhost-}" \
            --notes "Validated container: \`$RELEASE_IMAGE\`"

          {
            echo "### Self-host release published"
            echo "- Tag: \`$RELEASE_TAG\`"
            echo "- Container: \`$RELEASE_IMAGE\`"
            echo "- Source: \`$GITHUB_SHA\`"
          } >> "$GITHUB_STEP_SUMMARY"
