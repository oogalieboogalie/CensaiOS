<!-- module {"request": "a pomodoro timer", "manifest": {"name": "Pomodoro timer", "description": "25 minute focus blocks with short breaks.", "icon": "History", "size": {"w": 360, "h": 420}, "permissions": []}} -->
<div class="stack" style="align-items: center; gap: var(--space-4); height: 100%; justify-content: center">
  <div class="row" id="modes"></div>
  <svg viewBox="0 0 120 120" width="180" height="180" aria-hidden="true">
    <circle cx="60" cy="60" r="52" fill="none" stroke="var(--hairline)" stroke-width="6"/>
    <circle id="ring" cx="60" cy="60" r="52" fill="none" stroke="var(--accent)" stroke-width="6" stroke-linecap="round" transform="rotate(-90 60 60)" stroke-dasharray="326.7" stroke-dashoffset="0"/>
    <text id="clock" x="60" y="66" text-anchor="middle" fill="var(--ink)" font-size="22" font-family="var(--font-mono)">25:00</text>
  </svg>
  <div class="row">
    <button class="primary" id="toggle">Start</button>
    <button id="reset">Reset</button>
  </div>
  <div class="muted" id="count">0 focus blocks today</div>
</div>
<style>
  #modes button[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent-ink); border-color: var(--accent); }
</style>
<script>
  const MODES = { Focus: 25 * 60, 'Short break': 5 * 60, 'Long break': 15 * 60 };
  const today = new Date().toDateString();
  let mode = 'Focus';
  let remaining = MODES[mode];
  let timer = null;
  const stats = censai.storage.get('stats', { day: today, done: 0 });
  if (stats.day !== today) { stats.day = today; stats.done = 0; }
  const $ = (id) => document.getElementById(id);

  Object.keys(MODES).forEach((name) => {
    const b = document.createElement('button');
    b.textContent = name;
    b.onclick = () => setMode(name);
    $('modes').appendChild(b);
  });

  function setMode(name) { stop(); mode = name; remaining = MODES[name]; render(); }
  function stop() { clearInterval(timer); timer = null; }
  function tick() {
    remaining -= 1;
    if (remaining <= 0) {
      stop();
      if (mode === 'Focus') { stats.done += 1; censai.storage.set('stats', stats); censai.toast('Focus block done. Take a break.'); setMode('Short break'); return; }
      censai.toast('Break over.');
      setMode('Focus');
      return;
    }
    render();
  }
  function render() {
    const m = Math.floor(remaining / 60), s = remaining % 60;
    $('clock').textContent = String(m).padStart(2, '0') + ':' + String(s).padStart(2, '0');
    $('ring').setAttribute('stroke-dashoffset', String(326.7 * (1 - remaining / MODES[mode])));
    $('toggle').textContent = timer ? 'Pause' : (remaining < MODES[mode] ? 'Resume' : 'Start');
    $('count').textContent = stats.done + (stats.done === 1 ? ' focus block' : ' focus blocks') + ' today';
    $('modes').querySelectorAll('button').forEach((b) => b.setAttribute('aria-pressed', String(b.textContent === mode)));
  }
  $('toggle').onclick = () => { if (timer) stop(); else timer = setInterval(tick, 1000); render(); };
  $('reset').onclick = () => setMode(mode);
  censai.storage.onChange((key, value) => { if (key === 'stats' && value) { Object.assign(stats, value); render(); } });
  render();
</script>
