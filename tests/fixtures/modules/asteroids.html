<!-- module {"request": "simple Asteroids", "manifest": {"name": "Asteroids", "description": "Arrow keys to fly, space to shoot.", "icon": "Play", "size": {"w": 640, "h": 520}, "permissions": []}} -->
<div class="spread" style="margin-bottom: var(--space-2)"><span class="label">Arrows fly, space shoots</span><span class="num" id="hud">Score 0 · Best 0</span></div>
<canvas id="game" tabindex="0" aria-label="Asteroids game"></canvas>
<style>
  body { display: flex; flex-direction: column; }
  #game { flex: 1; width: 100%; min-height: 0; border: 1px solid var(--hairline); border-radius: var(--radius-md); background: var(--surface-2); outline: none; }
  #game:focus { border-color: var(--accent); }
</style>
<script>
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext && canvas.getContext('2d');
  const keys = {};
  let ship, rocks, shots, score, over, best = censai.storage.get('best', 0), last = 0;
  const color = (name) => getComputedStyle(document.documentElement).getPropertyValue(name).trim();
  function fit() { canvas.width = canvas.clientWidth || 600; canvas.height = canvas.clientHeight || 420; }
  function rock(x, y, r) { const a = Math.random() * Math.PI * 2, v = 0.4 + Math.random() * 1.2; return { x, y, r, vx: Math.cos(a) * v, vy: Math.sin(a) * v }; }
  function reset() {
    fit();
    ship = { x: canvas.width / 2, y: canvas.height / 2, a: -Math.PI / 2, vx: 0, vy: 0 };
    rocks = Array.from({ length: 5 }, () => rock(Math.random() * canvas.width, Math.random() * 60, 38));
    shots = []; score = 0; over = false;
  }
  function wrap(o) { o.x = (o.x + canvas.width) % canvas.width; o.y = (o.y + canvas.height) % canvas.height; }
  function step(t) {
    const dt = Math.min(32, t - last) / 16; last = t;
    if (!over) {
      if (keys.ArrowLeft) ship.a -= 0.07 * dt;
      if (keys.ArrowRight) ship.a += 0.07 * dt;
      if (keys.ArrowUp) { ship.vx += Math.cos(ship.a) * 0.12 * dt; ship.vy += Math.sin(ship.a) * 0.12 * dt; }
      ship.vx *= 0.99; ship.vy *= 0.99; ship.x += ship.vx * dt; ship.y += ship.vy * dt; wrap(ship);
      shots.forEach((s) => { s.x += s.vx * dt; s.y += s.vy * dt; s.life -= dt; wrap(s); });
      shots = shots.filter((s) => s.life > 0);
      rocks.forEach((r) => { r.x += r.vx * dt; r.y += r.vy * dt; wrap(r); });
      rocks = rocks.flatMap((r) => {
        const hit = shots.find((s) => Math.hypot(s.x - r.x, s.y - r.y) < r.r);
        if (!hit) return [r];
        hit.life = 0; score += 10;
        return r.r > 14 ? [rock(r.x, r.y, r.r / 2), rock(r.x, r.y, r.r / 2)] : [];
      });
      if (!rocks.length) rocks = Array.from({ length: 6 }, () => rock(Math.random() * canvas.width, 0, 38));
      if (rocks.some((r) => Math.hypot(ship.x - r.x, ship.y - r.y) < r.r + 8)) {
        over = true;
        if (score > best) { best = score; censai.storage.set('best', best); }
      }
    }
    draw();
    requestAnimationFrame(step);
  }
  function draw() {
    if (!ctx) return;
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.strokeStyle = color('--ink-soft'); ctx.lineWidth = 1.5;
    rocks.forEach((r) => { ctx.beginPath(); ctx.arc(r.x, r.y, r.r, 0, Math.PI * 2); ctx.stroke(); });
    ctx.fillStyle = color('--accent');
    shots.forEach((s) => ctx.fillRect(s.x - 1.5, s.y - 1.5, 3, 3));
    ctx.save(); ctx.translate(ship.x, ship.y); ctx.rotate(ship.a);
    ctx.strokeStyle = color('--accent'); ctx.beginPath(); ctx.moveTo(12, 0); ctx.lineTo(-8, 7); ctx.lineTo(-5, 0); ctx.lineTo(-8, -7); ctx.closePath(); ctx.stroke();
    ctx.restore();
    if (over) { ctx.fillStyle = color('--ink'); ctx.font = '16px ' + color('--font-sans'); ctx.textAlign = 'center'; ctx.fillText('Game over. Press Enter to play again.', canvas.width / 2, canvas.height / 2); }
    document.getElementById('hud').textContent = 'Score ' + score + ' · Best ' + best;
  }
  canvas.addEventListener('keydown', (e) => {
    keys[e.key] = true;
    if (e.key === ' ' && !over && shots.length < 6) shots.push({ x: ship.x, y: ship.y, vx: Math.cos(ship.a) * 6 + ship.vx, vy: Math.sin(ship.a) * 6 + ship.vy, life: 60 });
    if (e.key === 'Enter' && over) reset();
    if (e.key.startsWith('Arrow') || e.key === ' ') e.preventDefault();
  });
  canvas.addEventListener('keyup', (e) => { keys[e.key] = false; });
  window.addEventListener('resize', fit);
  reset();
  canvas.focus();
  requestAnimationFrame(step);
</script>
