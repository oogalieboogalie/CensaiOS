<!-- module {"request": "an invoice maker", "manifest": {"name": "Invoice maker", "description": "Line items, tax and a printable total.", "icon": "Files", "size": {"w": 560, "h": 600}, "permissions": []}} -->
<div class="stack" style="gap: var(--space-3)">
  <div class="spread"><h2>Invoice <span class="num muted" id="number"></span></h2><button id="print">Print</button></div>
  <div class="grid" style="grid-template-columns: 1fr 1fr">
    <label class="stack"><span class="label">Bill to</span><input id="client" placeholder="Client name"></label>
    <label class="stack"><span class="label">Due</span><input id="due" type="date"></label>
  </div>
  <table>
    <thead><tr><th>Item</th><th style="width:70px">Qty</th><th style="width:100px">Rate</th><th style="width:90px;text-align:right">Amount</th><th style="width:32px"></th></tr></thead>
    <tbody id="lines"></tbody>
  </table>
  <button class="ghost" id="add" style="align-self:flex-start">Add line</button>
  <div class="card stack" style="margin-left:auto; width: 240px">
    <div class="spread"><span class="muted">Subtotal</span><span class="num" id="sub"></span></div>
    <div class="spread"><span class="muted">Tax <input id="tax" type="number" min="0" step="0.1" style="width:60px;min-height:24px"> %</span><span class="num" id="taxOut"></span></div>
    <div class="spread"><strong>Total</strong><span class="big" id="total"></span></div>
  </div>
</div>
<script>
  const money = new Intl.NumberFormat(undefined, { style: 'currency', currency: 'USD' });
  let inv = censai.storage.get('invoice', { number: 1001, client: '', due: '', tax: 0, lines: [{ item: 'Listing photography', qty: 1, rate: 350 }, { item: 'Staging consult (hours)', qty: 2, rate: 90 }] });
  const $ = (id) => document.getElementById(id);
  function save() { censai.storage.set('invoice', inv); totals(); }
  function totals() {
    const sub = inv.lines.reduce((s, l) => s + (Number(l.qty) || 0) * (Number(l.rate) || 0), 0);
    const tax = sub * (Number(inv.tax) || 0) / 100;
    $('sub').textContent = money.format(sub);
    $('taxOut').textContent = money.format(tax);
    $('total').textContent = money.format(sub + tax);
    $('lines').querySelectorAll('tr').forEach((tr, i) => { const l = inv.lines[i]; tr.querySelector('.amt').textContent = money.format((Number(l.qty) || 0) * (Number(l.rate) || 0)); });
  }
  function render() {
    $('number').textContent = '#' + inv.number;
    ['client', 'due', 'tax'].forEach((f) => { if (document.activeElement !== $(f)) $(f).value = inv[f]; });
    $('lines').innerHTML = '';
    inv.lines.forEach((l, i) => {
      const tr = document.createElement('tr');
      tr.innerHTML = '<td><input data-f="item"></td><td><input data-f="qty" type="number" min="0"></td><td><input data-f="rate" type="number" min="0" step="0.01"></td><td class="num amt" style="text-align:right"></td><td><button class="ghost danger" aria-label="Remove line"><svg width="10" height="10" viewBox="0 0 10 10" stroke="currentColor" stroke-width="1.5"><path d="M2 2l6 6M8 2l-6 6"/></svg></button></td>';
      tr.querySelectorAll('input').forEach((input) => {
        input.value = l[input.dataset.f];
        input.oninput = () => { inv.lines[i] = { ...inv.lines[i], [input.dataset.f]: input.dataset.f === 'item' ? input.value : Number(input.value) }; save(); };
      });
      tr.querySelector('button').onclick = () => { inv.lines.splice(i, 1); save(); render(); };
      $('lines').appendChild(tr);
    });
    totals();
  }
  ['client', 'due', 'tax'].forEach((f) => { $(f).oninput = (e) => { inv[f] = f === 'tax' ? Number(e.target.value) : e.target.value; save(); }; });
  $('add').onclick = () => { inv.lines.push({ item: '', qty: 1, rate: 0 }); save(); render(); };
  $('print').onclick = () => window.print();
  censai.storage.onChange((k, v) => { if (k === 'invoice' && v) { inv = v; render(); } });
  render();
</script>
