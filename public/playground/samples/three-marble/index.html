<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Marble</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #111; font: 13px/1.4 system-ui, sans-serif; }
  canvas { display: block; outline: none; }
  #hud { position: fixed; top: 10px; left: 14px; right: 14px; display: flex; gap: 16px; color: #999; pointer-events: none; font-variant-numeric: tabular-nums; }
  #hud .right { margin-left: auto; }
  #hint { position: fixed; bottom: 14px; width: 100%; text-align: center; color: #777; pointer-events: none; }
</style>
</head>
<body>
<div id="hud"><span id="score">Gems 0</span><span id="time">0.0 s</span><span class="right" id="best"></span></div>
<div id="hint">Arrow keys or WASD to roll. Collect every gem.</div>
<script type="module" src="./main.js"></script>
</body>
</html>
