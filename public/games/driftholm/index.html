<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Driftholm</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #9ec3cc; }
  canvas { display: block; width: 100%; height: 100%; outline: none; touch-action: none; }
  #boot { position: fixed; inset: 0; display: grid; place-items: center; font: 500 13px/1.4 system-ui, sans-serif; color: #24343a; pointer-events: none; }
</style>
</head>
<body>
<canvas id="driftholm" tabindex="0"></canvas>
<div id="boot">Loading the island…</div>
<script type="module">
// The game page inside the Driftholm window. The window (our parent page,
// same origin) sends who you are and what other players are doing; the game
// sends back its panels, its saves and where you are each tick.
const alone = window.parent === window;
const post = (kind, data) => {
  if (alone) { if (kind !== 'hud' && kind !== 'net') console.log('[driftholm]', kind, data); return; }
  window.parent.postMessage({ source: 'driftholm', kind, data }, window.location.origin);
};
window.driftholmBridge = {
  emit(kind, json) {
    let data = null;
    try { data = JSON.parse(json); } catch { data = null; }
    if (kind === 'ready') document.getElementById('boot')?.remove();
    post(kind, data);
  },
};
document.addEventListener('contextmenu', (e) => e.preventDefault());

const waiting = [];
let push = null;
window.addEventListener('message', (event) => {
  if (event.source !== window.parent || event.origin !== window.location.origin) return;
  const message = event.data;
  if (!message || message.source !== 'driftholm-host' || !message.msg) return;
  const json = JSON.stringify(message.msg);
  if (push) push(json); else waiting.push(json);
});

try {
  const game = await import('./driftholm.js');
  await game.default();
  push = game.push_message;
  waiting.splice(0).forEach((json) => push(json));
  try {
    game.start();
  } catch (error) {
    // Some browsers hand control to the game loop by throwing this on purpose.
    if (!String(error?.message || error).includes('Using exceptions for control flow')) throw error;
  }
  if (alone) push(JSON.stringify({ t: 'init', name: 'Visitor', can_play: true, save: null, seed: 0 }));
  post('loaded', {});
} catch (error) {
  const boot = document.getElementById('boot');
  if (boot) boot.textContent = 'The island could not start in this browser.';
  post('problem', { error: String(error?.message || error) });
}
</script>
</body>
</html>
