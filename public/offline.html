<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>censaiOS</title>
  <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg">
  <style>
    :root { color-scheme: dark light; --bg: #0E0E0E; --ink: #EAEAEA; --soft: #9A9A96; --accent: #E5A83A; --line: #2A2A28; }
    @media (prefers-color-scheme: light) { :root { --bg: #F5F5F2; --ink: #1A1A18; --soft: #5F5F5A; --line: #DCDCD6; } }
    html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font: 15px/1.5 Inter, system-ui, sans-serif; }
    main { min-height: 100%; display: grid; place-items: center; padding: 24px; box-sizing: border-box; }
    .card { max-width: 420px; text-align: center; }
    img { width: 56px; height: 56px; }
    h1 { font-size: 22px; margin: 18px 0 8px; font-weight: 600; }
    p { color: var(--soft); margin: 0 0 12px; }
    button { margin-top: 10px; border: 0; border-radius: 10px; padding: 10px 18px; background: var(--accent); color: #0E0E0E; font: inherit; font-weight: 600; cursor: pointer; }
    .hint { margin-top: 18px; padding-top: 14px; border-top: 1px solid var(--line); font-size: 13px; }
  </style>
</head>
<body>
  <main>
    <div class="card">
      <img src="/assets/favicon.svg" alt="" />
      <h1>Can't reach your censaiOS computer</h1>
      <p>Your board is safe on that computer. It is off, asleep, or not on this network right now.</p>
      <button type="button" onclick="location.reload()">Try again</button>
      <p class="hint">Turn that computer on and make sure censaiOS is running there, then try again.</p>
    </div>
  </main>
</body>
</html>
